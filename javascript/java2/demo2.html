<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ball color Game</title>
<link rel="stylesheet" href="demo2.css">
</head>
<body>

<h2 class="title">BALL COLOR GAME</h2>

<div class="horizontal" id="horizontal"></div>

<div class="controls">
    <button id="add">ADD</button>
    <button id="removeLeft">REMOVE LEFT</button>
    <button id="removeRight">REMOVE RIGHT</button>
    <button id="shuffle">SHUFFLE</button>
    <button id="reset">RESET</button>
</div>

<div class="vertical" id="vertical"></div>

<div class="overlay win" id="win">
    <h1>🎉 CONGRATULATIONS 🎉</h1>
    <button onclick="restart()">PLAY AGAIN</button>
</div>

<div class="overlay lose" id="lose">
    <h1>❌ YOU LOSE ❌</h1>
    <button onclick="restart()">TRY AGAIN</button>
</div>

<script src="demo2.js"></script>
</body>
</html>
