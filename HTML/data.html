<head>

</head>
<style>

    }

    .footer {
        color: blue;
        position: absolute;
        top: 370px;
        left: 480px;
    }
</style>

<body>

    <div class="box-container">
        <div> <img src="../Image/arsenal.png" alt="" class="image">

            <div class="text">

            </div>
            <div>

            </div>
        </div>

    </div>

</html>
